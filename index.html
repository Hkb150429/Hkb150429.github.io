<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎光临 · 我的博客</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extras.css">
    <link rel="stylesheet" href="extras2.css">
    <link rel="stylesheet" href="extras3.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <div id="progressBar"></div>
    <header class="welcome-bar">
        <div class="welcome-text">
            <a href="index.html">🎉 <span data-i18n="welcome">欢迎光临</span> <span>***</span> <span data-i18n="blog">的博客</span><span class="home-hint" data-i18n="backHome">← 回首页</span></a>
        </div>
        <nav class="nav-tabs">
            <a href="index.html" class="nav-tab active" data-i18n="home">首页</a>
            <a href="projects.html" class="nav-tab" data-i18n="projects">项目</a>
            <a href="articles.html" class="nav-tab" data-i18n="articles">文章</a>
            <a href="archive.html" class="nav-tab" data-i18n="archive">归档</a>
            <a href="timeline.html" class="nav-tab" data-i18n="timeline">时间线</a>
            <a href="tags.html" class="nav-tab" data-i18n="tags">标签</a>
            <a href="categories.html" class="nav-tab" data-i18n="categories">分类</a>
            <a href="gallery.html" class="nav-tab" data-i18n="gallery">画廊</a>
            <a href="stats.html" class="nav-tab" data-i18n="stats">统计</a>
            <a href="sponsor.html" class="nav-tab" data-i18n="sponsor">赞赏</a>
            <a href="changelog.html" class="nav-tab" data-i18n="changelog">日志</a>
            <a href="links.html" class="nav-tab" data-i18n="links">友链</a>
            <a href="sitemap.html" class="nav-tab" data-i18n="sitemap">地图</a>
            <a href="404.html" class="nav-tab" data-i18n="notFound">404</a>
            <button class="lang-toggle" id="langToggle" title="切换语言">中</button>
            <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
        </nav>
    </header>
    <main class="container">
        <div class="home-hero">
            <h1><span data-i18n="hello">你好，我是</span> ***<span class="typewriter-cursor"></span></h1>
            <p data-i18n="homeDesc">欢迎来到我的博客，这里记录我的项目、文章、标签与分类。</p>

            <div class="home-links">
                <a href="projects.html" class="home-link">📦 <span data-i18n="projects">项目</span></a>
                <a href="articles.html" class="home-link">📝 <span data-i18n="articles">文章</span></a>
                <a href="archive.html" class="home-link">📅 <span data-i18n="archive">归档</span></a>
                <a href="timeline.html" class="home-link">📆 <span data-i18n="timeline">时间线</span></a>
                <a href="tags.html" class="home-link">🏷️ <span data-i18n="tags">标签</span></a>
                <a href="categories.html" class="home-link">📁 <span data-i18n="categories">分类</span></a>
                <a href="gallery.html" class="home-link">🖼️ <span data-i18n="gallery">画廊</span></a>
            </div>

            <div id="blogStats"></div>
            <div id="blogRuntime"></div>
            <div id="clockBox"></div>
            <div id="dailyQuote"></div>
            <div id="weatherBox" style="text-align:center;margin-top:1rem;"></div>

            <div class="social-links">
                <a href="https://www.luogu.com.cn/user/你的UID" target="_blank" rel="noopener" title="洛谷" class="social-link">

                </a>
                <a href="javascript:void(0)" onclick="navigator.clipboard.writeText('你的微信号').then(()=>alert('微信号已复制：你的微信号'))" title="微信（点击复制）" class="social-link">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8.69 4C4.99 4 2 6.55 2 9.7c0 1.78.98 3.36 2.5 4.41l-.63 1.88 2.2-1.14c.78.22 1.6.34 2.44.34.17 0 .33-.01.5-.02a5.44 5.44 0 0 1-.24-1.6c0-3.13 3-5.66 6.7-5.66.17 0 .34 0 .5.02C15.5 5.54 12.4 4 8.69 4zm-2.4 3.61a.84.84 0 1 1 0-1.68.84.84 0 0 1 0 1.68zm4.8 0a.84.84 0 1 1 0-1.68.84.84 0 0 1 0 1.68zM22 13.93c0-2.64-2.6-4.79-5.83-4.79-3.23 0-5.83 2.15-5.83 4.79 0 2.65 2.6 4.8 5.83 4.8.7 0 1.37-.11 2-.3l1.83.95-.52-1.56c1.5-.87 2.52-2.28 2.52-3.89zm-7.74-.78a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4zm3.83 0a.7.7 0 1 1 0-1.4.7.7 0 0 1 0 1.4z"/></svg>
                </a>

                </a>
                <a href="https://github.com/你的用户名" target="_blank" rel="noopener" title="GitHub" class="social-link">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.13c-3.2.69-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.35.78 1.05.78 2.12v3.14c0 .31.21.67.8.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
                </a>
                <a href="https://blog.csdn.net/你的用户名" target="_blank" rel="noopener" title="CSDN" class="social-link">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15h-2v-2h2v2zm0-4h-2V7h2v6zm6 4h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                </a>
            </div>

            <div class="home-extras">
                <div class="extra-card">
                    <div class="extra-card-title" data-i18n="hotArticles">🔥 热门文章</div>
                    <ul class="extra-list" id="hotList">
                        <li style="color:var(--text-faint);font-size:0.85rem;">加载中…</li>
                    </ul>
                </div>
                <div class="extra-card">
                    <div class="extra-card-title" data-i18n="pinnedArticles">📌 置顶文章</div>
                    <ul class="extra-list" id="pinnedList">
                        <li style="color:var(--text-faint);font-size:0.85rem;">加载中…</li>
                    </ul>
                </div>
            </div>

            <div style="margin-top: 2rem;">
                <div id="calendarBox"></div>
            </div>

            <div style="margin-top: 2rem;">
                <h3 style="font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:0.8rem;text-align:center;" data-i18n="tagHeatmap">🔥 标签热力图</h3>
                <div id="heatmapBox"></div>
            </div>

            <div style="margin-top: 2rem;">
                <h3 style="font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:0.8rem;text-align:center;" data-i18n="wordcloud">☁️ 文章词云</h3>
                <div id="wordcloudBox"></div>
            </div>

            <div style="margin-top: 2rem;">
                <h3 style="font-size:1.1rem;font-weight:800;color:var(--text);margin-bottom:0.8rem;text-align:center;" data-i18n="shortlink">🔗 短链生成</h3>
                <div id="shortLinkBox"></div>
            </div>

            <div style="margin-top: 1.5rem; display: flex; justify-content: center;">
                <button class="random-btn" onclick="goRandomArticle()" data-i18n="randomBtn">🎲 随机看一篇</button>
            </div>
        </div>
    </main>
    <button id="backToTop" title="回到顶部">↑</button>
    <script src="script.js"></script>
    <script src="extras.js"></script>
    <script src="extras2.js"></script>
    <script src="extras3.js"></script>
    <script>
        renderHotArticles('hotList');
        renderPinnedArticles('pinnedList');
        initBackToTop();
        initProgressBar();
        initThemeToggle();
        initThemeColorPicker();
        initEasterEgg();
        initBlogStats();
        initClock();
        initDailyQuote();
        initWeather();
        initBlogRuntime();
        initI18n();
        renderCalendar('calendarBox');
        renderTagHeatmap('heatmapBox');
        renderWordCloud('wordcloudBox');
        initShortLink();
        initMoreEggs();

        document.getElementById('langToggle').addEventListener('click', () => {
            toggleLang();
            const lang = localStorage.getItem('lang') || 'zh';
            document.getElementById('langToggle').textContent = lang === 'zh' ? '中' : 'EN';
        });
        const initLang = localStorage.getItem('lang') || 'zh';
        document.getElementById('langToggle').textContent = initLang === 'zh' ? '中' : 'EN';

        initTypewriter('.home-hero h1', ['你好，我是 ***', '欢迎来到我的博客', '这里记录我的项目与文章']);
    </script>
</body>
</html>
