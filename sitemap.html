<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站地图 · 我的博客</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extras.css">
    <link rel="stylesheet" href="extras2.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>

    <div id="progressBar"></div>

    <header class="welcome-bar">
        <div class="welcome-text">
            <a href="index.html">
                🎉 欢迎光临 <span>***</span> 的博客
                <span class="home-hint">← 回首页</span>
            </a>
        </div>
        <nav class="nav-tabs">
            <a href="index.html" class="nav-tab">首页</a>
            <a href="projects.html" class="nav-tab">项目</a>
            <a href="articles.html" class="nav-tab">文章</a>
            <a href="archive.html" class="nav-tab">归档</a>
            <a href="tags.html" class="nav-tab">标签</a>
            <a href="categories.html" class="nav-tab">分类</a>
            <a href="changelog.html" class="nav-tab">日志</a>
            <a href="links.html" class="nav-tab">友链</a>
            <a href="sitemap.html" class="nav-tab active">地图</a>
            <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
        </nav>
    </header>

    <main class="container">
        <h2 class="page-title">🗺️ 网站地图</h2>
        <div class="page-content">
            <h3>主要页面</h3>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="projects.html">项目</a></li>
                <li><a href="articles.html">文章</a></li>
                <li><a href="archive.html">归档</a></li>
                <li><a href="tags.html">标签</a></li>
                <li><a href="categories.html">分类</a></li>
                <li><a href="changelog.html">更新日志</a></li>
                <li><a href="links.html">友链</a></li>
                <li><a href="sitemap.html">网站地图</a></li>
            </ul>

            <h3>所有文章</h3>
            <ul id="sitemapArticles">
                <li style="color:var(--text-faint)">加载中…</li>
            </ul>
        </div>
    </main>

    <button id="backToTop" title="回到顶部">↑</button>

    <script src="script.js"></script>
    <script src="extras.js"></script>
    <script src="extras2.js"></script>
    <script>
        initBackToTop();
        initProgressBar();
        initThemeToggle();
        initThemeColorPicker();
        initEasterEgg();

        (async () => {
            try {
                const articles = await loadArticlesMeta();
                document.getElementById('sitemapArticles').innerHTML = articles.map(a =>
                    `<li><a href="article.html?id=${a.id}">${a.title}</a> <span style="color:var(--text-faint);font-size:0.85rem;">${a.date}</span></li>`
                ).join('');
            } catch (e) {
                document.getElementById('sitemapArticles').innerHTML = '<li style="color:var(--text-faint)">加载失败</li>';
            }
        })();
    </script>

</body>
</html>
