<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extras.css">
    <link rel="stylesheet" href="extras2.css">
    <link rel="stylesheet" href="extras3.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <div id="progressBar"></div>
    <header class="welcome-bar">
        <div class="welcome-text">
            <a href="index.html">🎉 <span data-i18n="welcome">欢迎光临</span> <span>***</span> <span data-i18n="blog">的博客</span><span class="home-hint" data-i18n="backHome">← 回首页</span></a>
        </div>
        <nav class="nav-tabs">
            <a href="index.html" class="nav-tab" data-i18n="home">首页</a>
            <a href="projects.html" class="nav-tab" data-i18n="projects">项目</a>
            <a href="articles.html" class="nav-tab" data-i18n="articles">文章</a>
            <a href="archive.html" class="nav-tab" data-i18n="archive">归档</a>
            <a href="timeline.html" class="nav-tab" data-i18n="timeline">时间线</a>
            <a href="tags.html" class="nav-tab" data-i18n="tags">标签</a>

            <a href="sitemap.html" class="nav-tab" data-i18n="sitemap">地图</a>
            <a href="404.html" class="nav-tab" data-i18n="notFound">404</a>
            <button class="lang-toggle" id="langToggle" title="切换语言">中</button>
            <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
        </nav>
    </header>
    <main class="container">
        <h2 class="page-title" data-i18n="linksTitle">🔗 友情链接</h2>
        <div class="page-content">
            <h3 data-i18n="friends">朋友们</h3>
            <ul>
                <li><a href="https://example.com" target="_blank" rel="noopener">朋友的博客</a> —— 简介写这里</li>
                <li><a href="https://example.com" target="_blank" rel="noopener">另一个朋友</a> —— 简介写这里</li>
            </ul>
            <h3 data-i18n="applyLink">申请友链</h3>
            <p style="color:var(--text-soft);line-height:1.8;" data-i18n="applyLinkDesc">
                想要交换友链？发邮件到 <a href="mailto:you@example.com">you@example.com</a>，附上您的网站名、网址、简介和头像。
            </p>
        </div>
    </main>
    <button id="backToTop" title="回到顶部">↑</button>
    <script src="script.js"></script>
    <script src="extras.js"></script>
    <script src="extras2.js"></script>
    <script src="extras3.js"></script>
    <script>
        initBackToTop();
        initProgressBar();
        initThemeToggle();
        initThemeColorPicker();
        initEasterEgg();
        initMoreEggs();
        initI18n();
        document.getElementById('langToggle').addEventListener('click', () => {
            toggleLang();
            const lang = localStorage.getItem('lang') || 'zh';
            document.getElementById('langToggle').textContent = lang === 'zh' ? '中' : 'EN';
        });
        document.getElementById('langToggle').textContent = (localStorage.getItem('lang') || 'zh') === 'zh' ? '中' : 'EN';
    </script>

</html>
