<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 我的博客</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extras.css">
    <link rel="stylesheet" href="extras2.css">
    <link rel="stylesheet" href="extras3.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body>
    <div id="progressBar"></div>
    <header class="welcome-bar">
        <div class="welcome-text">
            <a href="index.html">🎉 <span data-i18n="welcome">欢迎光临</span> <span>***</span> <span data-i18n="blog">的博客</span><span class="home-hint" data-i18n="backHome">← 回首页</span></a>
        </div>
        <nav class="nav-tabs">
            <a href="index.html" class="nav-tab" data-i18n="home">首页</a>
            <a href="projects.html" class="nav-tab" data-i18n="projects">项目</a>
            <a href="articles.html" class="nav-tab" data-i18n="articles">文章</a>
            <a href="archive.html" class="nav-tab" data-i18n="archive">归档</a>
            <a href="timeline.html" class="nav-tab" data-i18n="timeline">时间线</a>
            <a href="tags.html" class="nav-tab" data-i18n="tags">标签</a>
            <a href="categories.html" class="nav-tab" data-i18n="categories">分类</a>
            <a href="gallery.html" class="nav-tab" data-i18n="gallery">画廊</a>
            <a href="stats.html" class="nav-tab" data-i18n="stats">统计</a>
            <a href="sponsor.html" class="nav-tab" data-i18n="sponsor">赞赏</a>
            <a href="changelog.html" class="nav-tab" data-i18n="changelog">日志</a>
            <a href="links.html" class="nav-tab" data-i18n="links">友链</a>
            <a href="sitemap.html" class="nav-tab" data-i18n="sitemap">地图</a>
            <a href="404.html" class="nav-tab active" data-i18n="notFound">404</a>
            <button class="lang-toggle" id="langToggle" title="切换语言">中</button>
            <button class="theme-toggle" id="themeToggle" title="切换主题">🌙</button>
        </nav>
    </header>
    <main class="container">
        <div style="text-align:center;">
            <h1 style="font-size:5rem;font-weight:900;color:var(--accent);margin-bottom:0.5rem;">404</h1>
            <p style="font-size:1.1rem;color:var(--text-mute);margin-bottom:1.5rem;font-weight:600;" id="notFoundDesc">页面走丢了，来玩个小游戏吧</p>
        </div>
        <div class="game-wrap">
            <canvas id="gameCanvas"></canvas>
            <p style="font-size:0.8rem;color:var(--text-mute);margin-top:0.5rem;" id="gameHint">鼠标/手指控制挡板，接住小球</p>
        </div>
        <div style="text-align:center;margin-top:1.5rem;">
            <a href="index.html" class="home-link" id="backHomeBtn">🏠 返回首页</a>
        </div>
    </main>
    <button id="backToTop" title="回到顶部">↑</button>
    <script src="script.js"></script>
    <script src="extras.js"></script>
    <script src="extras2.js"></script>
    <script src="extras3.js"></script>
    <script>
        init404Game();
        initGameSwitcher();
        initBackToTop();
        initProgressBar();
        initThemeToggle();
        initThemeColorPicker();
        initEasterEgg();
        initMoreEggs();
        initI18n();

        function applyNotFoundLang() {
            const isEn = (localStorage.getItem('lang') || 'zh') === 'en';
            document.getElementById('notFoundDesc').textContent = isEn ? 'Page lost, play a game!' : '页面走丢了，来玩个小游戏吧';
            document.getElementById('gameHint').textContent = isEn ? 'Use keyboard/mouse to play' : '用键盘/鼠标操作游戏';
            document.getElementById('backHomeBtn').textContent = isEn ? '🏠 Back Home' : '🏠 返回首页';
        }

        applyNotFoundLang();

        document.getElementById('langToggle').addEventListener('click', () => {
            toggleLang();
            const lang = localStorage.getItem('lang') || 'zh';
            document.getElementById('langToggle').textContent = lang === 'zh' ? '中' : 'EN';
            applyNotFoundLang();
        });
        document.getElementById('langToggle').textContent = (localStorage.getItem('lang') || 'zh') === 'zh' ? '中' : 'EN';
    </script>
</body>
</html>
