<script>
  (function() {
    const player = document.getElementById('draggableMusicPlayer');
    let isDragging = false;
    let offsetX, offsetY;

    function onMouseDown(e) {
      isDragging = true;
      const rect = player.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      player.style.cursor = 'grabbing';
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      e.preventDefault();
    }

    function onMouseMove(e) {
      if (!isDragging) return;
      let x = e.clientX - offsetX;
      let y = e.clientY - offsetY;
      
      x = Math.max(0, Math.min(x, window.innerWidth - player.offsetWidth));
      y = Math.max(0, Math.min(y, window.innerHeight - player.offsetHeight));
      player.style.left = x + 'px';
      player.style.top = y + 'px';
      player.style.right = 'auto';
      player.style.bottom = 'auto';
    }

    function onMouseUp() {
      isDragging = false;
      player.style.cursor = 'grab';
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    
    player.addEventListener('mousedown', onMouseDown);
  })();
